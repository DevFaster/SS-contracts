name: Secret Scanning Allowlist Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-allowlist:
    name: Validate Secret Scanning Allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4.43.1

      - name: Validate allowlist entries
        run: |
          bash scripts/secret-scan-allowlist.sh check .github/secret-scan-allowlist.yml

      - name: Summarize allowlist (on failure)
        if: failure()
        run: |
          bash scripts/secret-scan-allowlist.sh summarize .github/secret-scan-allowlist.yml

      - name: Prepare allowlist entries for the PR summary
        if: always() && hashFiles('.github/secret-scan-allowlist.yml') != ''
        run: yq -o=json '.allowlist // []' .github/secret-scan-allowlist.yml > allowlist.json

      - name: Post validation summary
        if: always() && hashFiles('allowlist.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const entries = JSON.parse(fs.readFileSync('allowlist.json', 'utf8'));
            if (context.issue.number && entries.length > 0) {
                let table = '| Index | Pattern (truncated) | Issue ID | Expires | Owner | Description |\n';
                table += '|-------|---------------------|----------|---------|-------|-------------|\n';
                entries.forEach((entry, idx) => {
                  const pattern = entry.pattern ? entry.pattern.substring(0, 35) + (entry.pattern.length > 35 ? '..' : '') : 'N/A';
                  table += `| ${idx} | ${pattern} | ${entry.issue_id || 'MISSING'} | ${entry.expires || 'MISSING'} | ${entry.owner || 'MISSING'} | ${entry.description || 'MISSING'} |\n`;
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: [
                    '### Secret Scanning Allowlist Validation',
                    '',
                    'Automated validation of secret scanning allowlist entries.',
                    '',
                    '**Entries:**',
                    table,
                    '',
                    '> **Note**: All entries must have an issue_id, expiration date, owner, and description. Raw secret values are prohibited.'
                  ].join('\n')
                });
            }
